<!DOCTYPE html>
<html>
<head>
    <title>AI Disease Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            text-align: center;
            color: white;
            padding: 30px;
        }

        h1 {
            animation: fadeIn 2s ease-in-out;
        }

        .container {
            background: white;
            color: black;
            width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
            animation: slideUp 1s ease;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 10px;
            border: none;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: green;
            animation: fadeIn 1s ease-in-out;
        }

        .note {
            font-size: 12px;
            margin-top: 15px;
            color: gray;
        }

        /* Animations */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<h1>🧠 AI Disease Prediction System</h1>

<div class="container">

<form action="/predict" method="post">

    <label>🌡 Fever</label>
    <select name="fever"><option value="1">Yes</option><option value="0">No</option></select>

    <label>😷 Cough</label>
    <select name="cough"><option value="1">Yes</option><option value="0">No</option></select>

    <label>🤕 Headache</label>
    <select name="headache"><option value="1">Yes</option><option value="0">No</option></select>

    <label>😴 Fatigue</label>
    <select name="fatigue"><option value="1">Yes</option><option value="0">No</option></select>

    <label>🤢 Nausea</label>
    <select name="nausea"><option value="1">Yes</option><option value="0">No</option></select>

    <label>🤮 Vomiting</label>
    <select name="vomiting"><option value="1">Yes</option><option value="0">No</option></select>

    <label>😖 Sore Throat</label>
    <select name="sore_throat"><option value="1">Yes</option><option value="0">No</option></select>

    <label>💪 Body Pain</label>
    <select name="body_pain"><option value="1">Yes</option><option value="0">No</option></select>

    <label>😵 Dizziness</label>
    <select name="dizziness"><option value="1">Yes</option><option value="0">No</option></select>

    <label>🤧 Cold</label>
    <select name="cold"><option value="1">Yes</option><option value="0">No</option></select>

    <button type="submit">🔍 Predict Disease</button>

</form>

{% if prediction %}
<div class="result">
    🩺 Predicted Disease: {{ prediction }}
</div>
{% endif %}

<div class="note">
    *This is not a medical diagnosis. Consult a doctor.
</div>

</div>

</body>
</html>
